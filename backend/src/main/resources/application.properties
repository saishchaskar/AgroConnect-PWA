spring.application.name=agroconnect-backend
server.port=8080

# H2 file-based database (persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/agroconnect
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini API
gemini.api.key=${GCP_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent

# Firebase
firebase.service-account.path=classpath:serviceAccountKey.json
firebase.project.id=agroconnect-ind

# CORS
cors.allowed-origins=http://localhost:4200,http://localhost:3000
